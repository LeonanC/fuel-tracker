name: fuel_tracker
description: "Aplicativo completo e intuitivo para o gerenciamento de
  combustível, registo de despesas e controlo de manutenções veiculares."

publish_to: 'none'

version: 11.4.7

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  equatable: ^2.1.0
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_launcher_icons: ^0.14.4
  flutter_local_notifications: ^22.3.1
  flutter_localizations:
    sdk: flutter
  flutter_masked_text2: ^0.9.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^11.2.0
  fluttertoast: ^10.0.0
  get: ^4.7.3
  get_it: ^9.2.1
  get_storage: ^2.1.1
  google_fonts: ^8.2.1
  google_nav_bar: ^5.0.7
  image_picker: ^1.2.3
  intl: ^0.20.2
  json_annotation: ^4.12.0
  mask_text_input_formatter: ^2.9.0
  open_filex: ^4.7.0
  ota_update: ^7.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  pdf: ^3.13.1
  printing: ^5.15.1
  remixicon: ^4.9.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.17.2
  url_launcher: ^6.3.2
  version: ^3.0.2

dev_dependencies:
  build_runner: ^2.15.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
